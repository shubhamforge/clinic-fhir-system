@if (hasData()) {
  <svg
    class="pa-chart-svg"
    [attr.viewBox]="'0 0 ' + W_ + ' ' + H_"
    preserveAspectRatio="none"
    role="img"
    aria-label="Blood pressure chart"
  >
    <!-- Reference bands -->
    @for (b of bands(); track $index) {
      <rect
        [attr.x]="b.x"
        [attr.y]="b.y"
        [attr.width]="b.w"
        [attr.height]="b.h"
        [attr.fill]="b.fill"
      />
    }

    <!-- Dashed target line at 130 -->
    <line
      [attr.x1]="padL_"
      [attr.x2]="W_ - padR_"
      [attr.y1]="targetY()"
      [attr.y2]="targetY()"
      stroke="var(--px-accent)"
      stroke-width="1"
      stroke-dasharray="2 3"
      opacity="0.4"
    />

    <!-- Grid lines + y labels -->
    @for (g of gridLineY(); track g.t) {
      <line
        [attr.x1]="padL_"
        [attr.x2]="W_ - padR_"
        [attr.y1]="g.y"
        [attr.y2]="g.y"
        stroke="var(--px-border)"
        stroke-width="0.5"
        opacity="0.5"
      />
      <text
        [attr.x]="padL_ - 6"
        [attr.y]="g.y + 3"
        font-size="9"
        fill="var(--px-text-subtle)"
        text-anchor="end"
        font-family="JetBrains Mono, monospace"
      >
        {{ g.t }}
      </text>
    }

    <!-- X labels -->
    @for (xl of xLabels(); track xl.i) {
      <text
        [attr.x]="xl.x"
        [attr.y]="H_ - 8"
        font-size="9"
        fill="var(--px-text-subtle)"
        text-anchor="middle"
        font-family="JetBrains Mono, monospace"
      >
        {{ xl.label }}
      </text>
    }

    <!-- Diastolic line (dashed) -->
    <path
      [attr.d]="diaLine()"
      stroke="var(--px-accent)"
      stroke-width="1.5"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="4 3"
      opacity="0.7"
    />

    <!-- Systolic line (solid) -->
    <path
      [attr.d]="sysLine()"
      stroke="var(--px-accent)"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Diastolic dots -->
    @for (d of diaDots(); track $index) {
      <circle
        [attr.cx]="d.x"
        [attr.cy]="d.y"
        [attr.r]="$last ? 3 : 1.6"
        fill="var(--px-surface)"
        stroke="var(--px-accent)"
        stroke-width="1.4"
        opacity="0.85"
      >
        <title>{{ d.label }}</title>
      </circle>
    }

    <!-- Systolic dots -->
    @for (s of sysDots(); track $index) {
      <circle
        [attr.cx]="s.x"
        [attr.cy]="s.y"
        [attr.r]="$last ? 3.5 : 2"
        fill="var(--px-accent)"
      >
        <title>{{ s.label }}</title>
      </circle>
    }
  </svg>
}
