<div class="pa-app">
  <div class="pa-select-screen">
    <div class="pa-brand">
      <div class="pa-brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 12h4l2-4 3 8 2-4h7"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <span>Vitalist</span>
      <span class="pa-brand-sub">· for patients</span>
    </div>

    <div class="pa-select-hero">
      <h1>Welcome.</h1>
      <p>Choose your profile to continue.</p>
    </div>

    <div class="pa-select-list">
      @if (patients() === null) {
        @for (_ of [1, 2, 3]; track $index) {
          <div class="pa-select-row pa-select-row--shimmer">
            <div
              class="pa-shimmer"
              style="
                width: 44px;
                height: 44px;
                border-radius: 14px;
                flex-shrink: 0;
              "
            ></div>
            <div
              style="flex: 1; display: flex; flex-direction: column; gap: 6px"
            >
              <div class="pa-shimmer" style="width: 120px; height: 14px"></div>
              <div class="pa-shimmer" style="width: 80px; height: 12px"></div>
            </div>
          </div>
        }
      } @else {
        @for (p of patients(); track p.id) {
          <button
            class="pa-select-row"
            [class.selected]="selectedId() === p.id"
            (click)="select(p.id)"
          >
            <cp-avatar
              [firstName]="p.firstName"
              [lastName]="p.lastName"
              [hue]="p.avatarHue"
              [size]="44"
              [radiusPercent]="32"
            />
            <div class="pa-select-body">
              <div class="pa-select-name">
                {{ p.firstName }} {{ p.lastName }}
              </div>
              <div class="pa-select-meta">
                {{ computeAge(p.dob) }} · {{ p.gender | titlecase }}
              </div>
            </div>
            <svg
              class="pa-select-chev"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M9 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        }
      }
    </div>

    <div class="pa-select-footer">Demo profiles · tap to continue</div>
  </div>
</div>
